# CI：只跑「不依赖本机环境」的那部分。
#
# 为什么是 windows-latest：这个项目的执行层就是 Windows（cmd / GBK 落盘 /
# 临时 .bat / ping 语义），跑在 ubuntu 上等于测了个别的项目。
#
# 故意不进 CI 的：
#   · smoke      —— 会真跑 `check-instance` 之类走 ahk 桥的片段，需要 listener.ahk 常驻
#   · ui:multi / ui:queue / ui:history —— 需要本机 Chrome + 在线服务 + 桥
# 这两类留在本地手动跑，判据写在 docs/03-reference.md §16。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: PowerShell 脚本（UTF-8 BOM + 语法）
        # PS 5.1 无 BOM 时按 CP936 读 .ps1，中文注释会让引号配对错位、脚本一行都不执行
        # （ISSUE-017）。这条门禁就是不让它再靠人眼发现。
        run: npm run check:ps1

      - name: bridge/ 护栏（不含私人路径 / cursor 工作流）
        # 通用版被人整份拷回定制版时，功能不会立刻坏，但会悄悄带进私有路径。
        # 这条只读源码，不依赖本机环境，适合放 CI。
        run: npm run check:bridge

      - name: 队列必须真串行
        run: npm run test:queue

      - name: 命令语义保真度
        run: npm run test:cmd

      - name: 环境变量注入（PROG_DIR / AHK_DIR 到达子进程）
        run: npm run test:env

      - name: 搜索（CJK 子串 + 多词 AND）
        run: npm run test:search

      - name: expect（三源 / 编码 / 正则预算）
        run: npm run test:expect

      - name: 桥文件解析（instances / status / UTF-16 / 排序）
        run: npm run test:bridge

      - name: 实例下拉识别（命令形态 / admin 前缀 / 冲突放弃）
        run: npm run test:picks

      - name: 程序发现（分类 / 去重 / include / 配置归一）
        run: npm run test:programs

      - name: 历史导入（清洗 / 残句 / 危险标记）
        run: npm run test:import

      - name: 构建前端（冒烟会验静态壳与 SPA 回退）
        run: npm run build:web

      - name: API 冒烟（真实路由 + 无桥降级路径）
        # CI 上没有 listener。用 SNIPDECK_SMOKE_BRIDGE 指一个不存在的目录，
        # 冒烟会走「bridgeUp=false → 跳过 /api/run 实跑」那条分支，
        # 其余 171 条（鉴权 / 404 / 脱敏 / CRUD / 设置 / 实例表 / 程序列表）照样打真路由。
        run: npm run smoke --workspace @snipdeck/server
        env:
          SNIPDECK_SMOKE_BRIDGE: 'C:\no-such-bridge'
