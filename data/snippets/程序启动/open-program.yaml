id: open-program
title: 启动程序（按快捷方式名）
group: 程序启动
target: win-desktop
shell: cmd
tags: [gui, launch]
meta:
  source: termius-command
  note: '对应 %PROG_DIR%\<名>.lnk；PROG_DIR 由 ahk.bat 内部默认值决定'
vars:
  pro: { prompt: 程序名, default: wechat }
steps:
  - do: run
    cmd: 'call C:\ahk_trigger\ahk.bat lnk {{pro}}'
    timeout: 30
