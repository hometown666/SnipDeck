<!doctype html>
<html lang="zh-CN" data-theme="claude" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151513" />
    <meta name="description" content="自托管的片段库 + 跨设备执行工作台" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SnipDeck" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>SnipDeck</title>
  </head>
  <body>
    <!-- 阶段 C1（HTTPS 计划，docs/08-https.md / ISSUE-030 加固）：
         React 挂载前先显示这段兜底，避免 JS 没加载出来时纯黑屏、无线索。
         样式内联：此时外层 styles.css 可能还没生效。配色与暗色主题一致。 -->
    <div id="root">
      <div
        style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#151513;color:#e8e6e1;font-family:system-ui,sans-serif;padding:24px;text-align:center"
      >
        <div style="font-size:18px;font-weight:600">SnipDeck 加载中…</div>
        <div style="font-size:13px;color:#9a948a;max-width:420px;line-height:1.6">
          若长时间停留在此页，请检查网络，或清掉本站数据后重试（手机：设置 → 站点 → 清除数据）。
        </div>
      </div>
    </div>
    <noscript>
      <div
        style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#151513;color:#e8e6e1;font-family:system-ui,sans-serif"
      >
        SnipDeck 需要启用 JavaScript 才能运行。
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
